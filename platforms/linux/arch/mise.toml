# Arch Linux / Manjaro 的显式根包示例。
[settings]
system_packages.managers = ["pacman", "aur"]

[bootstrap.packages]
"pacman:base" = "latest"
"pacman:base-devel" = "latest"
"pacman:git" = "latest"
"pacman:openssh" = "latest"
"pacman:python" = "latest"
"pacman:ripgrep" = "latest"

# AUR 由 yay 或 paru 执行。先准备其中一个 helper，再按需取消注释。
# "aur:visual-studio-code-bin" = "latest"
# "aur:google-chrome" = "latest"
