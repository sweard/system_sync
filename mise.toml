# 仓库任务与配置部署入口。各平台的系统软件声明位于 packages/ 下。
# 全局开发环境由 dotfiles/common/mise/config.toml 及其平台配置管理。
#
# 已启用 espanso、全局 mise 工具配置、zsh、ChatGPT 和 VS Code。
# 公共配置位于 dotfiles/common，平台差异分别位于 dotfiles/macos 和 dotfiles/linux。
min_version = "2026.10.11"
monorepo_root = true

[settings.task]
# 状态与审计任务需要先报告缺失工具，不能在执行前自动补装。
# 本仓库的开发工具使用 mise install 显式安装。
run_auto_install = false

[monorepo]
config_roots = [
  "packages/linux/arch",
  "packages/linux/debian",
  "packages/linux/fedora",
  "packages/linux/opensuse",
]

[tasks.package-status]
alias = "status"
description = "查看系统软件声明、缺失项和额外软件；不执行安装或清理预演"
run = "./scripts/system-sync.sh --status"

[tasks.package-capture]
description = "预览本机软件清单与合并候选；--apply 仅保存本机快照，不改写受管清单"
raw = true
run = "./helper/scripts/run.sh package-capture"

[tasks.machine-init]
description = "预览新机器接入；--apply 输入 yes 分阶段补装并保留已有软件，支持 --only packages/config/tools"
raw = true
run = "./helper/scripts/run.sh machine-init"

[tasks.audit]
description = "只读审计 tools、packages、PATH 和配置映射；支持 --json、--strict、--only、--color"
# 直接连接输出，让颜色判断使用终端的真实状态；查询输出由审计脚本过滤和脱敏。
raw = true
# 在任务运行器前置工具目录前保存调用终端的 PATH。
env.SYSTEM_SYNC_AUDIT_CALLER_PATH = '{{ get_env(name="PATH", default="") }}'
run = "./helper/scripts/run.sh audit"

[tasks.check]
description = "校验仓库预编译包，显式构建 Go helper 并运行 Go/Python 隔离测试；不修改系统软件"
run = [
  "./helper/scripts/verify.sh",
  "./helper/scripts/build.sh",
  "python3 ./tests/reference/sync_runtime.py --check",
  "mise tasks validate",
  "./helper/scripts/test.sh",
  "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v",
]

[tasks.clean]
description = "预览本机验证环境与缓存清理；--apply 输入 yes 执行，--apply --yes 跳过确认"
raw = true
run = "./scripts/clean.sh"

[tasks.helper-build]
description = "从仓库 Go 源码构建并安装本机 helper；固定 Go 1.27.3"
run = "./helper/scripts/build.sh"

[tasks.helper-dist]
description = "构建 macOS/Linux × ARM64/x86_64 预编译归档和 SHA256SUMS"
run = "./helper/scripts/build.sh --dist"

[tasks.helper-bundle]
description = "从源码更新 helper/prebuilt/<版本>/ 的四个平台归档与校验清单，需一同提交"
run = "./helper/scripts/build.sh --bundle"

[tasks.helper-install]
description = "从仓库 helper/prebuilt/ 校验安装 helper；可指定本机产物目录，无需 Go 编译器"
run = "./helper/scripts/install.sh"

[tasks.package-dry-run]
alias = "dry-run"
description = "预览系统软件安装、收敛及清理计划；不修改软件状态"
run = "./scripts/system-sync.sh --dry-run"

[tasks.system-sync]
description = "按当前系统配置安装缺失项，并经交互确认后收敛"
confirm = { message = "这会修改系统包状态。是否进入平台对应的确认流程？", default = "no" }
raw = true
run = "./scripts/system-sync.sh --apply"

[tasks.package-install]
description = "安装一个系统根包，成功后加入当前平台清单；支持 --dry-run"
raw = true
run = "./helper/scripts/run.sh package install"

[tasks.package-uninstall]
description = "卸载一个系统根包，成功后移出当前平台清单；支持 --dry-run"
raw = true
run = "./helper/scripts/run.sh package uninstall"

[tasks.macos-upgrade]
description = "单独升级 macOS Brewfile 中声明的软件，不执行 cleanup"
confirm = { message = "这会升级 Brewfile 中的软件。是否继续进入升级确认流程？", default = "no" }
raw = true
run = "./scripts/homebrew-converge.sh --upgrade"

# dotfiles 命令应用已启用的映射；ChatGPT / VS Code 的私有键保留在本机。
[tasks.config-status]
description = "查看已启用 dotfiles 映射的状态"
raw = true
run = "./helper/scripts/run.sh config status"

[tasks.config-dry-run]
description = "比较受管配置的实际差异；无变化时明确提示无需同步"
raw = true
run = "./scripts/config-preview.sh"

[tasks.config-sync]
description = "备份并应用本仓库的配置映射，复查结果；输入 yes 确认，支持 --dry-run、--yes"
raw = true
run = "./helper/scripts/run.sh config sync"

[tasks.config-detach]
description = "将当前受管配置保留为本机独立文件；支持 --dry-run、--yes，备份保存在仓库外"
raw = true
run = "./helper/scripts/run.sh config-detach"

[tasks.vscode-status]
alias = "vscode-dry-run"
description = "核对 VS Code 扩展；--capture 采集新增项及本机版本变化，支持 --only、--exclude、--group，--apply 输入 yes 写入"
raw = true
run = "./helper/scripts/run.sh vscode status"

[tasks.vscode-sync]
description = "按清单安装公共 VS Code 扩展；不删除其他扩展"
confirm = { message = "这会按清单固定版本安装扩展，可能降级本机较新版本。若需保留本机版本，请先运行 mise run vscode-status --capture 并审阅、写入清单。是否继续？", default = "no" }
raw = true
run = "./helper/scripts/run.sh vscode sync"

[tasks.config-history-init]
description = "登记并列出本机配置路径；仅本机历史、手动保存"
run = "./helper/scripts/run.sh config-history init"

[tasks.config-save]
description = "手动保存本机配置检查点，列出保存及跳过的路径；支持 -d 描述"
raw = true
run = "./helper/scripts/run.sh config-history save"

[tasks.config-history]
description = "列出仅本机保存的配置检查点；支持原生 history ls 参数"
raw = true
run = "./helper/scripts/run.sh config-history list"

# -----------------------------------------------------------------------------
# 已启用的公共配置
#
# 根配置只声明跨平台公共映射；mise.macos.toml / mise.linux.toml 是两个平台适配器。
# .miserc.toml 的 auto_env 会自动选择当前平台的配置部署适配器。
#
[dotfiles]
# mise 2026.10.15 的 dry-run 会把 symlink 模式的 miserc 当作普通配置解析。
# 模板部署避开错误的预览解析；修改来源后用 config-sync 同步。
"~/.config/mise/miserc.toml" = { source = "dotfiles/common/mise/miserc.toml", mode = "template" }
"~/.config/mise/config.toml" = { source = "dotfiles/common/mise/config.toml", mode = "symlink" }
"~/.config/mise/mise.lock" = { source = "dotfiles/common/mise/mise.lock", mode = "symlink" }
"~/.config/zsh/path.sh" = { source = "dotfiles/common/shell/path.sh", mode = "symlink" }
"~/.zshenv" = { source = "dotfiles/common/zsh/zshenv", mode = "symlink" }
"~/.zshrc" = { source = "dotfiles/common/zsh/zshrc", mode = "symlink" }
"~/.p10k.zsh" = { source = "dotfiles/common/zsh/p10k.zsh", mode = "symlink" }
# 应用会自行改写配置；merge 只管理来源列出的键，其余内容留在本机。
"~/.codex/config.toml/shared" = { source = "dotfiles/common/chatgpt/config.toml", merge = true }
"~/.codex/AGENTS.md" = { source = "dotfiles/common/chatgpt/AGENTS.md", mode = "copy" }
"~/.codex/keybindings.json" = { source = "dotfiles/common/chatgpt/keybindings.json", mode = "copy" }
