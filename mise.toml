# 公共任务入口。各平台的软件声明位于 packages/ 下。
#
# 开发工具、环境变量、PATH 和 dotfiles 的候选配置目前全部保持注释，
# 不会改变当前电脑。公共候选位于 dotfiles/common，平台差异分别位于
# dotfiles/macos 和 dotfiles/linux。
monorepo_root = true

[monorepo]
config_roots = [
  "packages/linux/arch",
  "packages/linux/debian",
  "packages/linux/fedora",
]

[tasks.status]
description = "查看当前系统的声明状态和差异（只读）"
run = "./scripts/system-sync.sh --status"

[tasks.dry-run]
description = "预览当前系统将安装、收敛或清理的内容"
run = "./scripts/system-sync.sh --dry-run"

[tasks.system-sync]
description = "按当前系统配置安装缺失项，并经交互确认后收敛"
confirm = { message = "这会修改系统包状态。是否进入平台对应的确认流程？", default = "no" }
raw = true
run = "./scripts/system-sync.sh --apply"

[tasks.macos-upgrade]
description = "单独升级 macOS Brewfile 中声明的软件，不执行 cleanup"
confirm = { message = "这会升级 Brewfile 中的软件。是否继续进入升级确认流程？", default = "no" }
raw = true
run = "./scripts/homebrew-converge.sh --upgrade"

# dotfiles 命令入口可以安全保留；公共和平台映射均被注释，当前不会接管任何文件。
[tasks.config-status]
description = "查看已启用 dotfiles 映射的状态"
run = "mise bootstrap dotfiles status"

[tasks.config-dry-run]
description = "预览已启用 dotfiles 映射将产生的文件变更"
run = "mise bootstrap dotfiles apply --dry-run"

[tasks.config-sync]
description = "应用已启用的 dotfiles 映射；默认需要确认"
confirm = { message = "这会修改已启用映射对应的用户配置文件。是否继续？", default = "no" }
run = "mise bootstrap dotfiles apply"

# -----------------------------------------------------------------------------
