# 仓库任务与配置部署入口。各平台的系统软件声明位于 packages/ 下。
# 全局开发环境由 dotfiles/common/mise/config.toml 及其平台配置管理。
#
# 已启用 espanso、全局 mise 工具配置、zsh、ChatGPT 和 VS Code。
# 公共配置位于 dotfiles/common，平台差异分别位于 dotfiles/macos 和 dotfiles/linux。
min_version = "2026.10.11"
monorepo_root = true

[settings.task]
# 状态与审计任务需要先报告缺失工具，不能在执行前自动补装。
# 本仓库的开发工具使用 mise install 显式安装。
run_auto_install = false

[monorepo]
config_roots = [
  "packages/linux/arch",
  "packages/linux/debian",
  "packages/linux/fedora",
  "packages/linux/opensuse",
]

[tasks.status]
description = "查看当前系统的声明状态和差异（只读）"
run = "./scripts/system-sync.sh --status"

[tasks.audit]
description = "只读审计 tools、packages、PATH 和配置映射；支持 --json、--strict、--only、--color"
# 直接连接输出，让颜色判断使用终端的真实状态；查询输出由审计脚本过滤和脱敏。
raw = true
# 在任务运行器前置工具目录前保存调用终端的 PATH。
env.SYSTEM_SYNC_AUDIT_CALLER_PATH = '{{ get_env(name="PATH", default="") }}'
run = "python3 -B ./scripts/audit.py"

[tasks.check]
description = "检查前置版本、任务配置并运行隔离测试；不修改系统软件"
run = [
  "python3 ./scripts/sync_runtime.py --check",
  "mise tasks validate",
  "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v",
]

[tasks.dry-run]
description = "预览当前系统将安装、收敛或清理的内容"
run = "./scripts/system-sync.sh --dry-run"

[tasks.system-sync]
description = "按当前系统配置安装缺失项，并经交互确认后收敛"
confirm = { message = "这会修改系统包状态。是否进入平台对应的确认流程？", default = "no" }
raw = true
run = "./scripts/system-sync.sh --apply"

[tasks.package-install]
description = "安装一个系统根包，成功后加入当前平台清单；支持 --dry-run"
raw = true
run = "python3 ./scripts/package-command.py install"

[tasks.package-uninstall]
description = "卸载一个系统根包，成功后移出当前平台清单；支持 --dry-run"
raw = true
run = "python3 ./scripts/package-command.py uninstall"

[tasks.macos-upgrade]
description = "单独升级 macOS Brewfile 中声明的软件，不执行 cleanup"
confirm = { message = "这会升级 Brewfile 中的软件。是否继续进入升级确认流程？", default = "no" }
raw = true
run = "./scripts/homebrew-converge.sh --upgrade"

# dotfiles 命令应用已启用的映射；ChatGPT / VS Code 的私有键保留在本机。
[tasks.config-status]
description = "查看已启用 dotfiles 映射的状态"
run = "mise bootstrap dotfiles status"

[tasks.config-dry-run]
description = "比较受管配置的实际差异；无变化时明确提示无需同步"
run = "./scripts/config-preview.sh"

[tasks.config-sync]
description = "应用已启用的 dotfiles 映射；默认需要确认"
confirm = { message = "这会修改已启用映射对应的用户配置文件。是否继续？", default = "no" }
run = "mise bootstrap dotfiles apply"

# -----------------------------------------------------------------------------
# 已启用的公共配置
#
# 根配置只声明跨平台公共映射；mise.macos.toml / mise.linux.toml 是两个平台适配器。
# .miserc.toml 的 auto_env 会自动选择当前平台的配置部署适配器。
#
[dotfiles]
# mise 2026.10.15 的 dry-run 会把 symlink 模式的 miserc 当作普通配置解析。
# 模板部署避开错误的预览解析；修改来源后用 config-sync 同步。
"~/.config/mise/miserc.toml" = { source = "dotfiles/common/mise/miserc.toml", mode = "template" }
"~/.config/mise/config.toml" = { source = "dotfiles/common/mise/config.toml", mode = "symlink" }
"~/.config/zsh/path.sh" = { source = "dotfiles/common/shell/path.sh", mode = "symlink" }
"~/.zshenv" = { source = "dotfiles/common/zsh/zshenv", mode = "symlink" }
"~/.zshrc" = { source = "dotfiles/common/zsh/zshrc", mode = "symlink" }
"~/.p10k.zsh" = { source = "dotfiles/common/zsh/p10k.zsh", mode = "symlink" }
# 应用会自行改写配置；merge 只管理来源列出的键，其余内容留在本机。
"~/.codex/config.toml/shared" = { source = "dotfiles/common/chatgpt/config.toml", merge = true }
"~/.codex/AGENTS.md" = { source = "dotfiles/common/chatgpt/AGENTS.md", mode = "copy" }
"~/.codex/keybindings.json" = { source = "dotfiles/common/chatgpt/keybindings.json", mode = "copy" }
