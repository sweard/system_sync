name: Check

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.15']
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Isolate mise state from runner configuration
        shell: bash
        run: |
          for part in CONFIG SYSTEM_CONFIG DATA STATE CACHE; do
            printf 'MISE_%s_DIR=%s/system-sync/%s\n' "$part" "$RUNNER_TEMP" "$part" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.10.15'
          install: false
          cache: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prepare Linux shell test prerequisite
        if: runner.os == 'Linux'
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends zsh
          fi
      - name: Trust this checkout and run isolated tests
        run: |
          mise trust --all
          mise run check
