name: Check

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.15']
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Isolate mise state from runner configuration
        shell: bash
        run: |
          for part in CONFIG SYSTEM_CONFIG DATA STATE CACHE; do
            printf 'MISE_%s_DIR=%s/system-sync/%s\n' "$part" "$RUNNER_TEMP" "$part" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: '2026.10.15'
          install: false
          cache: false
          env: false
          add_shims_to_path: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prepare Linux shell test prerequisite
        if: runner.os == 'Linux'
        run: |
          if ! command -v zsh >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends zsh
          fi
      - name: Verify bundled helper before preparing a compiler
        shell: bash
        run: |
          ./scripts/helper-verify.sh
          ./scripts/system-sync-helper.sh --version
      - name: Prepare pinned Go compiler for explicit builds
        shell: bash
        run: |
          mise trust --all
          mise install go@1.27.3
          printf '%s/bin\n' "$(mise where go@1.27.3)" >> "$GITHUB_PATH"
      - name: Run isolated tests
        run: |
          mise run check

  helper-artifacts:
    name: Precompiled helpers
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MISE_AUTO_INSTALL: 'false'
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: '2026.10.15'
          install: false
          cache: false
          env: false
          add_shims_to_path: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build four platform archives from public source only
        shell: bash
        run: |
          mise trust --all
          mise install go@1.27.3
          mise exec go@1.27.3 -- ./scripts/helper-build.sh --dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-sync-helper-${{ github.sha }}
          path: |
            .system-sync/dist/*/*.tar.gz
            .system-sync/dist/*/SHA256SUMS
            .system-sync/dist/*/SOURCE_SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
