# Arch Linux / Manjaro 的基础声明与 Brewfile 对应软件。
# 2026-10-21 核对 Arch 官方稳定仓库；对应关系与未匹配项见 README.md。
# 首次 apply 前仍需合并目标机器的完整 baseline。
[settings]
system_packages.managers = ["pacman", "aur"]

[bootstrap.packages]
"pacman:base" = "latest"
"pacman:base-devel" = "latest"
"pacman:git" = "latest"
"pacman:jq" = "latest"
"pacman:openssh" = "latest"
"pacman:python" = "latest"
"pacman:ripgrep" = "latest"
"pacman:zsh" = "latest"

# Brewfile formula 对应的官方包；git 已在上方声明。
"pacman:cmake" = "latest"
"pacman:fastfetch" = "latest"
"pacman:fd" = "latest"
"pacman:github-cli" = "latest" # Homebrew: gh
"pacman:git-lfs" = "latest"
"pacman:htop" = "latest"
"pacman:llama-cpp" = "latest" # Homebrew: llama.cpp
"pacman:lsd" = "latest"
"pacman:neovim" = "latest"
"pacman:poppler" = "latest"
"pacman:7zip" = "latest" # Homebrew: sevenzip
"pacman:mise" = "latest"

# 本机采集的新增根包候选；审阅后合并，原声明及选项保持。
"pacman:diffutils" = "latest"
"pacman:less" = "latest"
"pacman:multipath-tools" = "latest"
"pacman:openai-codex" = "latest"
"pacman:sudo" = "latest"
"pacman:vulkan-dzn" = "latest"
