# 全局开发环境：工具版本、mise 设置和环境变量。
# 部署到 ~/.config/mise/config.toml；仓库任务与部署映射位于根 mise.toml。
# macOS 的 Rust 交叉编译目标位于 config.macos.toml；Linux 首次安装仍需验证。

# 只遮蔽 mise 处理的输出；mise env / exec 和 raw 任务仍可能输出真实值。
redactions = ["*_TOKEN", "*_SECRET", "*_PASSWORD", "*_API_KEY"]

[settings]
# 保留现有项目的版本选择；项目文件优先于这里的全局默认值。
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "java", "rust"]
# 原 nvm 工作流不根据 package.json 自动切换 Node。
idiomatic_version_file_disable_files = ["node:package.json"]

[tools]
node = "26.12.0"
# Python 解释器由 mise 管理；Apple Python 继续由系统维护。
python = "3.15.0"
ruby = "4.0.7"
java = "jetbrains-21.0.6-b895.109"
rust = "1.99.0"
bun = "1.4.3"
uv = "0.13.1"
# Yarn Classic 使用 npm 后端，避免默认注册表切换到其他 Yarn 实现。
"npm:yarn" = { version = "1.22.22", depends = ["node"] }
# 包含 Dart；当前机器复用已备份的 SDK，新机器从 Flutter 官方归档安装。
flutter = "3.47.2"

[env]
# 可选本机文件；不存在时跳过，文件内的全部值标为敏感。
_.file = { path = "{{ env.HOME }}/.config/mise/secrets.env", redact = true }
# SDK 环境与 zsh 共用一份声明；用户命令目录由 zsh 在 mise 激活前加载。
# 等项目变量和工具环境解析后再计算 SDK 路径。
_.source = { path = "{{ config_source | canonicalize | dirname }}/../shell/path.sh", tools = true }

# uv 负责依赖和虚拟环境，解释器统一由 mise 选择，禁止另行下载。
UV_PYTHON = { value = "{{ tools.python.path }}/bin/python3", tools = true }
UV_PYTHON_DOWNLOADS = "never"
