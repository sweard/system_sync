# Linux 全局环境和 PATH 候选。所有设置当前均被注释。
# Android SDK 和 JetBrains Toolbox 使用常见 Linux 位置；启用前应按本机核对。
#
# [env]
# ANDROID_HOME = "{{ env.HOME }}/Android/Sdk"
# PYENV_ROOT = "{{ env.HOME }}/.pyenv"
#
# Linux locale 必须先由发行版生成，再按实际结果选择；不要照搬 macOS 的 LANG/LC_ALL。
# LANG = "en_US.UTF-8"
# LC_ALL = "en_US.UTF-8"
