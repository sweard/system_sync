# macOS 全局开发环境差异。保留现有 Rust 组件和交叉编译目标。
[tools]
rust = { version = "1.99.1", components = ["rust-src"], targets = ["aarch64-apple-darwin", "aarch64-linux-android", "i686-linux-android", "x86_64-apple-darwin", "x86_64-linux-android"] }

[env]
# 保留本机原 locale；Android 与 PATH 由公共 path.sh 按平台识别。
LANG = "zh"
LC_ALL = "en_US.UTF-8"
